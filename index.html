<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>收納App</title>
<style>
  :root { --bg: #F2E8D8; --card: #FFFCF7; --text: #5B4636; --accent: #8C6A4F; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; line-height: 1.7; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
  .card { background: var(--card); border-radius: 16px; padding: 24px; margin-bottom: 16px; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  h2 { font-size: 20px; margin: 0 0 8px; }
  a { color: var(--accent); }
  ul { padding-left: 1.2em; margin: 0; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>收納App</h1>
    <p>用 2.5D 的「家」畫面，記錄每個櫃子、每一格裡放了什麼。給自己和家人親友使用的 Android App。</p>
  </div>
  <div class="card">
    <h2>功能</h2>
    <ul>
      <li>在手機上畫出房間格局，放上櫃子，設定列數與欄數</li>
      <li>點櫃子、點格子，查看裡面的物品</li>
      <li>新增物品：拍照或從相簿選、名稱、日期、標籤</li>
      <li>到期提醒、搜尋、未分類清單</li>
      <li>備份與還原；可選擇自動備份到使用者自己的 Google 雲端硬碟</li>
    </ul>
  </div>
  <div class="card">
    <h2>隱私權</h2>
    <p>資料只存在使用者自己的手機與自己的 Google 雲端硬碟，不會傳給開發者或第三方。詳見 <a href="privacy.html">隱私權政策</a>。</p>
  </div>
</main>
</body>
</html>
